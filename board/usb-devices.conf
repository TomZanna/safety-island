# Dispositivi USB da attaccare a WSL (scripts/usb-attach.sh), per hardware-id VID:PID.
# Il busid si ricava a ogni giro dal server usbipd-win: cambiare porta USB non conta.
# Su Windows ogni VID:PID qui deve avere la policy AutoBind (vedi README, "USB in WSL").
1366:1020  J-Link
0403:6011  FTDI quad (USB J15 della EVK: LPUART8, -, LPUART1, LPUART2)
1fc9:0027  ROM i.MX94 in serial download (SDP)
1fc9:0151  SPL i.MX9 in serial download (SDPV: secondo stadio di uuu -b sd/emmc)
1fc9:0152  U-Boot fastboot (uuu -b sd/emmc: scrittura dei boot media)
